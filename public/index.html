<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FikaBros</title>

  <!-- Leaflet: the map library (Folium was generating this for us before) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

    <style>
    /* Page = header on top, map filling everything below it */
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }

    header {
      display: flex;
      align-items: center;
      gap: 10px;                 /* space between logo and title, for later */
      padding: 16px 18px;
      background: white;
      border-bottom: 1px solid #ddd;
      font-family: sans-serif;
    }
    header h1 { margin: 0; font-size: 30px; }
    header { flex-wrap: wrap; }  /* on narrow screens the search bar drops to its own line */

    /* Search bar, pushed to the right end of the header */
    #search-form { margin-left: auto; display: flex; gap: 6px; }
    #search-input {
      width: 260px;
      padding: 7px 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    #search-form button {
      padding: 7px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f4f4f4;
      cursor: pointer;
    }

    /* The red pin marking a searched location */
    .search-pin {
      box-sizing: border-box;
      background: #d93025;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    /* A place that IS the searched location: its usual icon inside a red ring */
    .match-highlight {
      box-sizing: border-box;
      background: white;
      border: 3px solid #d93025;
      border-radius: 50%;
      padding: 3px;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    #map { flex: 1; }            /* map takes all remaining height */
      /* "Show my location" button: matches the + / − zoom buttons */
    .locate-btn { font-size: 18px; cursor: pointer; }

    /* The blue "you are here" dot */
    .user-dot {
      box-sizing: border-box;
      background: #1a73e8;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    /* "Open now only" checkbox: styled like Leaflet's layers panel */
    .open-only {
      background: white;
      padding: 6px 10px;
      font: 12px/1.5 "Helvetica Neue", Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .open-only input { vertical-align: middle; margin: 0 4px 0 0; }
  </style>
</head>
<body>
    <header>
      <img src="graphics/fikabros-logo.png" alt="FikaBRos logo" style="height: 46px;">
      <h1>FikaBRos. <span style="font-weight: normal;">Fika-as-a-Service.</span></h1>

      <!-- Search bar: type an address or place, press Enter or Go -->
      <form id="search-form">
        <input id="search-input" type="search"
               placeholder="Search a place in Stockholm…" aria-label="Search a place in Stockholm">
        <button type="submit">Go</button>
      </form>
  </header>
  <div id="map"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- PapaParse: reads the CSV file -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- opening_hours.js: understands OpenStreetMap opening-hours text like "Mo-Fr 08:00-18:00" -->
  <script src="https://openingh.openstreetmap.de/build/opening_hours+deps.min.js"></script>

  <script>
    // =====================================================
    // SETTINGS: change these and reload to see the effect
    // =====================================================
    const DATA_FILE   = "stockholm_places_tidy.csv";   // must sit next to this file
    const CARTO_KEY   = "cb1_4uxk_1_45a18e416a37b014c37182fc";
    const CENTER      = [59.3293, 18.0686];            // Stockholm city centre
    const START_ZOOM  = 13;

    const DOT_RADIUS  = 4;      // dot size in pixels
    const DOT_OPACITY = 0.8;    // 0 = invisible, 1 = solid

    const COLORS = {
      restroom:      "blue",
      cafe:          "orange",
      bakery:        "red",
      pastry:        "purple",
      confectionery: "pink",
      ice_cream:     "green",
    };

    const ICON_SIZE = 20;

    const ALPHA_GAIN   = 3;     // >1 makes faint lines more solid (1 = as before)
    const LINE_THICKEN = 0.1;   // extra line thickness in pixels (0 = as before)

    // Categories listed here show their drawing; the rest stay coloured dots
    const ICON_FILES = {
      restroom:      "graphics/toilet.svg",
      bakery:        "graphics/cinnamonRoll.svg",
      ice_cream:     "graphics/iceCream.svg",
      confectionery: "graphics/candy.svg",
      pastry:        "graphics/cake.svg",
      cafe:          "graphics/coffee.svg",
    };

    // How each category is written in tooltips (the CSV keeps its own spelling)
    const CATEGORY_LABELS = {
      ice_cream: "ice cream",
    };

    // Opening hours
    const HOURS_COLUMN     = "opening_hours";  // CSV column holding OSM opening-hours text
    const UNKNOWN_OPACITY  = 0.4;              // places with no/unreadable hours are drawn faded
    const HIDE_UNKNOWN     = false;            // true = "Open now only" also hides unknown-hours places
    const REFRESH_SECONDS  = 60;               // how often to re-check who is open

    // Search bar
    const SEARCH_ZOOM = 16;                            // how close to zoom in on a search result
    const SEARCH_AREA = "17.75,59.45,18.35,59.20";     // only search inside this box (west,north,east,south)
    const MATCH_DISTANCE = 25;   // metres: a search result this close to one of our places IS that place
    const HIGHLIGHT_SIZE = 32;   // pixels: the ringed icon of a matched place (ring + padding + ICON_SIZE)

    // Where we are, so the library knows Swedish public holidays ("PH off")
    const HOLIDAY_REGION = {
      lat: CENTER[0], lon: CENTER[1],
      address: { country_code: "se", state: "Stockholms län" },
    };

    // =====================================================
    // MAP + BASEMAP
    // =====================================================
    const map = L.map("map").setView(CENTER, START_ZOOM);

    L.tileLayer(
      `https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=${CARTO_KEY}`,
      {
        maxZoom: 20,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
                     '&copy; <a href="https://carto.com/attributions">CARTO</a>',
      }
    ).addTo(map);

        // =====================================================
    // "SHOW MY LOCATION" BUTTON
    // =====================================================
    const LocateButton = L.Control.extend({
      options: { position: "topleft" },          // sits under the zoom buttons
      onAdd() {
        const box = L.DomUtil.create("div", "leaflet-bar");
        const btn = L.DomUtil.create("a", "locate-btn", box);
        btn.href = "#";
        btn.title = "Show my location";
        btn.setAttribute("role", "button");
        btn.innerHTML = "◎";
        L.DomEvent.on(btn, "click", (e) => {
          L.DomEvent.preventDefault(e);
          L.DomEvent.stopPropagation(e);
          map.locate({ setView: true, maxZoom: 16 });   // ask the browser, then zoom there
        });
        return box;
      },
    });
    map.addControl(new LocateButton());

    let userDot = null;
    let userCircle = null;

    map.on("locationfound", (e) => {
      if (userDot) {
        // Clicked again: just move the existing dot
        userDot.setLatLng(e.latlng);
        userCircle.setLatLng(e.latlng).setRadius(e.accuracy);
      } else {
        // Pale circle = how accurate the browser says the position is
        userCircle = L.circle(e.latlng, {
          radius: e.accuracy, color: "#1a73e8", weight: 1, fillOpacity: 0.15, interactive: false,
        }).addTo(map);
        userDot = L.marker(e.latlng, {
          icon: L.divIcon({ className: "user-dot", iconSize: [18, 18] }),
          zIndexOffset: 1000,                     // always on top of the places
        }).bindTooltip("You are here").addTo(map);
      }
    });

    map.on("locationerror", (e) => {
      alert("Couldn't get your location: " + e.message);
    });

    // =====================================================
    // SEARCH BAR
    // Sends the typed text to Nominatim (OpenStreetMap's free address search),
    // which answers with coordinates. Only runs on Enter/Go, never while typing:
    // Nominatim allows at most one request per second and no autocomplete.
    // =====================================================
    let searchPin = null;

    document.getElementById("search-form").addEventListener("submit", async (e) => {
      e.preventDefault();                                 // don't reload the page
      const query = document.getElementById("search-input").value.trim();
      if (query === "") return;

      const url = "https://nominatim.openstreetmap.org/search?" + new URLSearchParams({
        q: query,
        format: "jsonv2",
        limit: 1,                  // just the best match
        countrycodes: "se",
        viewbox: SEARCH_AREA,
        bounded: 1,                // 1 = nothing outside SEARCH_AREA
      });

      try {
        const response = await fetch(url);
        const results = await response.json();

        if (results.length === 0) {
          alert(`Couldn't find "${query}" in Stockholm.`);
          return;
        }

        const found = results[0];
        const latlng = [Number(found.lat), Number(found.lon)];
        // Full names are long ("Medborgarplatsen, Södermalm, ..., Sverige"): keep the first two parts
        const shortName = found.display_name.split(",").slice(0, 2).join(",");

        map.setView(latlng, SEARCH_ZOOM);

        // Is the search result one of our own places? Then ring that place instead of dropping a pin.
        const match = findPlaceAt(latlng);
        setHighlight(match);
        const visibleCopy = match && entries.find(en => en.place === match && map.hasLayer(en.marker));

        if (visibleCopy) {
          if (searchPin) map.removeLayer(searchPin);   // no pin on top of the place
          visibleCopy.marker.openTooltip();            // shows its name + hours right away
        } else if (searchPin) {
          // Searched before: move the existing pin (and put it back if a match had hidden it)
          searchPin.setLatLng(latlng).setTooltipContent(escapeHtml(shortName)).addTo(map);
          searchPin.openTooltip();
        } else {
          searchPin = L.marker(latlng, {
            icon: L.divIcon({ className: "search-pin", iconSize: [18, 18] }),
            zIndexOffset: 900,                    // above the places, below "you are here"
          }).bindTooltip(escapeHtml(shortName)).addTo(map);
          searchPin.openTooltip();
        }
      } catch (err) {
        alert("Search didn't work: " + err.message);
      }
    });

    // =====================================================
    // ONE GROUP OF DOTS PER BUTTON
    // =====================================================
    const groups = {
      "Everything": L.layerGroup(),
      "Bathroom":   L.layerGroup(),
      "Fika":       L.layerGroup(),   // cafe, bakery, pastry, confectionery, ice_cream
    };

    // Every marker we draw, with the place it shows and the group it lives in.
    // (Each place has one marker in "Everything" and one in "Bathroom" or "Fika".)
    const entries = [];

    // Make text safe to show inside the tooltip
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    // Category as shown to people: from CATEGORY_LABELS, otherwise "_" → " "
    function categoryLabel(category) {
      return CATEGORY_LABELS[category] || String(category).replaceAll("_", " ");
    }

        // Turn colour names like "blue" into three numbers between 0 and 1
    function toRGB(colorName) {
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.fillStyle = colorName;                 // browser converts any CSS colour to "#rrggbb"
      const hex = ctx.fillStyle;
      return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
    }

    // One colour filter per category: dark lines → category colour, white → transparent
    let filterDefs = "";
    for (const category of Object.keys(ICON_FILES)) {
      const [r, g, b] = toRGB(COLORS[category] || "gray");
      const k = ALPHA_GAIN;
      filterDefs += `
        <filter id="tint-${category}" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="
            0 0 0 0 ${r}
            0 0 0 0 ${g}
            0 0 0 0 ${b}
            ${-0.2126 * k} ${-0.7152 * k} ${-0.0722 * k} ${k} 0"/>
          <feMorphology operator="dilate" radius="${LINE_THICKEN}"/>
        </filter>`;
    }
    document.body.insertAdjacentHTML("beforeend",
      `<svg width="0" height="0" style="position:absolute">${filterDefs}</svg>`);

    // Build each icon once; every point of that category reuses it.
    // highlightIcons = the same drawing inside a red ring, for a place that matches a search.
    const icons = {};
    const highlightIcons = {};
    for (const [category, file] of Object.entries(ICON_FILES)) {
      const html = `<img src="${file}" alt=""
                    style="display:block; width:100%; height:100%; filter:url(#tint-${category});">`;
      icons[category] = L.divIcon({
        className: "",                           // removes Leaflet's default white box
        html,
        iconSize: [ICON_SIZE, ICON_SIZE],
        iconAnchor: [ICON_SIZE / 2, ICON_SIZE / 2],
        tooltipAnchor: [ICON_SIZE / 2, 0],
      });
      highlightIcons[category] = L.divIcon({
        className: "match-highlight",            // red ring, see the <style> block
        html,
        iconSize: [HIGHLIGHT_SIZE, HIGHLIGHT_SIZE],
        iconAnchor: [HIGHLIGHT_SIZE / 2, HIGHLIGHT_SIZE / 2],
        tooltipAnchor: [HIGHLIGHT_SIZE / 2, 0],
      });
    }

    function makeDot(place) {
      const label = `${escapeHtml(place.name)} (${escapeHtml(categoryLabel(place.category))})`;
      const icon = icons[place.category];

      if (icon) {
        return L.marker([place.lat, place.lon], { icon }).bindTooltip(label);
      }

      // No drawing for this category yet: keep the coloured dot
      const color = COLORS[place.category] || "gray";
      return L.circleMarker([place.lat, place.lon], {
        radius: DOT_RADIUS, color, fillColor: color, fillOpacity: DOT_OPACITY,
      }).bindTooltip(label);
    }

    // =====================================================
    // SEARCH RESULT = ONE OF OUR PLACES?
    // =====================================================

    // The closest place within MATCH_DISTANCE metres of latlng, or null if none is that close.
    // map.distance works in metres, so the threshold means the same thing north–south and east–west.
    function findPlaceAt(latlng) {
      let best = null;
      let bestDistance = MATCH_DISTANCE;
      for (const { place } of entries) {
        const d = map.distance(latlng, [place.lat, place.lon]);
        if (d <= bestDistance) { best = place; bestDistance = d; }
      }
      return best;
    }

    let highlighted = null;   // the place currently ringed, if any

    // Ring `place` (both of its markers), and un-ring whatever was ringed before. null = ring nothing.
    function setHighlight(place) {
      for (const { place: p, marker } of entries) {
        if (p !== place && p !== highlighted) continue;   // only touch the old and new place
        const on = (p === place);
        if (marker.setIcon) {
          marker.setIcon(on ? highlightIcons[p.category] : icons[p.category]);
          marker.setZIndexOffset(on ? 800 : 0);           // ringed place sits above its neighbours
        } else {
          marker.setRadius(on ? DOT_RADIUS * 2 : DOT_RADIUS);   // plain dots just grow
        }
      }
      highlighted = place;
    }

    // =====================================================
    // OPEN OR CLOSED RIGHT NOW?
    // =====================================================

    // Read a place's hours text once and keep the result on the place.
    // place.hours ends up as an opening_hours object, or null if missing/unreadable.
    function readHours(place) {
      const text = place[HOURS_COLUMN];
      place.hours = null;
      if (text == null || String(text).trim() === "") return;
      try {
        place.hours = new opening_hours(String(text), HOLIDAY_REGION, { tag_key: "opening_hours" });
      } catch (err) {
        console.warn(`Couldn't read hours for ${place.name}: "${text}"`, err);
      }
    }

    // "open", "closed" or "unknown"
    function openStatus(place, now) {
      if (!place.hours) return "unknown";
      if (place.hours.getUnknown(now)) return "unknown";
      return place.hours.getState(now) ? "open" : "closed";
    }

    // "18:00" if it's today, otherwise "Mon 08:00"
    function formatTime(date, now) {
      const time = date.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
      if (date.toDateString() === now.toDateString()) return time;
      return date.toLocaleDateString("en-GB", { weekday: "short" }) + " " + time;
    }

    // Tooltip text, e.g. "Café Pascal (cafe) · Open, closes 18:00"
    function tooltipText(place, status, now) {
      let text = `${escapeHtml(place.name)} (${escapeHtml(categoryLabel(place.category))})`;
      if (status === "unknown") return text + " · Hours unknown";

      const next = place.hours.getNextChange(now);
      if (status === "open") {
        text += next ? ` · Open, closes ${formatTime(next, now)}` : " · Open";
      } else {
        text += next ? ` · Closed, opens ${formatTime(next, now)}` : " · Closed";
      }
      return text;
    }

    // Fade or un-fade a marker (icons and coloured dots need different calls)
    function setFaded(marker, faded) {
      if (marker.setOpacity) {
        marker.setOpacity(faded ? UNKNOWN_OPACITY : 1);
      } else {
        marker.setStyle({
          opacity: faded ? UNKNOWN_OPACITY : 1,
          fillOpacity: faded ? UNKNOWN_OPACITY * DOT_OPACITY : DOT_OPACITY,
        });
      }
    }

    let openOnly = false;   // flipped by the checkbox

    // Go through every marker: show/hide it, fade it, update its tooltip
    function updateOpenStatus() {
      const now = new Date();   // the visitor's current time

      for (const { place, group, marker } of entries) {
        const status = openStatus(place, now);

        let show = true;
        if (openOnly && status === "closed") show = false;
        if (openOnly && status === "unknown" && HIDE_UNKNOWN) show = false;

        if (show && !group.hasLayer(marker)) group.addLayer(marker);
        if (!show && group.hasLayer(marker)) group.removeLayer(marker);

        setFaded(marker, status === "unknown");
        marker.setTooltipContent(tooltipText(place, status, now));
      }
    }

    // "Open now only" checkbox, sits under the Everything/Bathroom/Fika panel
    const OpenOnlyControl = L.Control.extend({
      options: { position: "topright" },
      onAdd() {
        const box = L.DomUtil.create("label", "leaflet-bar open-only");
        box.innerHTML = `<input type="checkbox"> Open now only`;
        L.DomEvent.disableClickPropagation(box);   // clicking it shouldn't click the map
        box.querySelector("input").addEventListener("change", (e) => {
          openOnly = e.target.checked;
          updateOpenStatus();
        });
        return box;
      },
    });

    // =====================================================
    // LOAD THE CSV AND DRAW THE DOTS
    // =====================================================
    Papa.parse(DATA_FILE, {
      download: true,        // fetch the file from the website
      header: true,          // first row = column names
      dynamicTyping: true,   // turn "59.33" into the number 59.33
      skipEmptyLines: true,
      complete: (results) => {
        for (const place of results.data) {
          if (place.lat == null || place.lon == null) continue;

          readHours(place);

          const everythingDot = makeDot(place);
          groups["Everything"].addLayer(everythingDot);
          entries.push({ place, group: groups["Everything"], marker: everythingDot });

          const button = place.category === "restroom" ? "Bathroom" : "Fika";
          const buttonDot = makeDot(place);
          groups[button].addLayer(buttonDot);
          entries.push({ place, group: groups[button], marker: buttonDot });
        }

        // Show "Everything" first, then add the radio-button panel
        groups["Everything"].addTo(map);
        L.control.layers(groups, null, { collapsed: false, position: "topright" }).addTo(map);
        map.addControl(new OpenOnlyControl());

        // Work out open/closed now, and again every minute
        updateOpenStatus();
        setInterval(updateOpenStatus, REFRESH_SECONDS * 1000);
      },
    });
  </script>
</body>
</html>
