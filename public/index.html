<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FikaBros</title>

  <!-- Leaflet: the map library (Folium was generating this for us before) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

    <style>
    /* Page = header on top, map filling everything below it */
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; }

    header {
      display: flex;
      align-items: center;
      gap: 10px;                 /* space between logo and title, for later */
      padding: 16px 18px;
      background: white;
      border-bottom: 1px solid #ddd;
      font-family: sans-serif;
    }
    header h1 { margin: 0; font-size: 30px; }

    #map { flex: 1; }            /* map takes all remaining height */
      /* "Show my location" button: matches the + / − zoom buttons */
    .locate-btn { font-size: 18px; cursor: pointer; }

    /* The blue "you are here" dot */
    .user-dot {
      box-sizing: border-box;
      background: #1a73e8;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
    <header>
      <img src="graphics/fikabros-logo.png" alt="FikaBRos logo" style="height: 46px;">
      <h1>FikaBRos. <span style="font-weight: normal;">Fika-as-a-Service.</span></h1>
  </header>
  <div id="map"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- PapaParse: reads the CSV file -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // =====================================================
    // SETTINGS: change these and reload to see the effect
    // =====================================================
    const DATA_FILE   = "stockholm_places_tidy.csv";   // must sit next to this file
    const CARTO_KEY   = "cb1_4uxk_1_45a18e416a37b014c37182fc";
    const CENTER      = [59.3293, 18.0686];            // Stockholm city centre
    const START_ZOOM  = 13;

    const DOT_RADIUS  = 4;      // dot size in pixels
    const DOT_OPACITY = 0.8;    // 0 = invisible, 1 = solid

    const COLORS = {
      restroom:      "blue",
      cafe:          "orange",
      bakery:        "red",
      pastry:        "purple",
      confectionery: "pink",
      ice_cream:     "green",
    };

    const ICON_SIZE = 20;   

    const ALPHA_GAIN   = 3;     // >1 makes faint lines more solid (1 = as before)
    const LINE_THICKEN = 0.1;   // extra line thickness in pixels (0 = as before)

    // Categories listed here show their drawing; the rest stay coloured dots
    const ICON_FILES = {
      restroom:      "graphics/toilet.svg",
      bakery:        "graphics/cinnamonRoll.svg",
      ice_cream:     "graphics/iceCream.svg",
      confectionery: "graphics/candy.svg",
      pastry:        "graphics/cake.svg",
      cafe:          "graphics/coffee.svg",    
    };

    // =====================================================
    // MAP + BASEMAP
    // =====================================================
    const map = L.map("map").setView(CENTER, START_ZOOM);

    L.tileLayer(
      `https://basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png?key=${CARTO_KEY}`,
      {
        maxZoom: 20,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> ' +
                     '&copy; <a href="https://carto.com/attributions">CARTO</a>',
      }
    ).addTo(map);

        // =====================================================
    // "SHOW MY LOCATION" BUTTON
    // =====================================================
    const LocateButton = L.Control.extend({
      options: { position: "topleft" },          // sits under the zoom buttons
      onAdd() {
        const box = L.DomUtil.create("div", "leaflet-bar");
        const btn = L.DomUtil.create("a", "locate-btn", box);
        btn.href = "#";
        btn.title = "Show my location";
        btn.setAttribute("role", "button");
        btn.innerHTML = "◎";
        L.DomEvent.on(btn, "click", (e) => {
          L.DomEvent.preventDefault(e);
          L.DomEvent.stopPropagation(e);
          map.locate({ setView: true, maxZoom: 16 });   // ask the browser, then zoom there
        });
        return box;
      },
    });
    map.addControl(new LocateButton());

    let userDot = null;
    let userCircle = null;

    map.on("locationfound", (e) => {
      if (userDot) {
        // Clicked again: just move the existing dot
        userDot.setLatLng(e.latlng);
        userCircle.setLatLng(e.latlng).setRadius(e.accuracy);
      } else {
        // Pale circle = how accurate the browser says the position is
        userCircle = L.circle(e.latlng, {
          radius: e.accuracy, color: "#1a73e8", weight: 1, fillOpacity: 0.15, interactive: false,
        }).addTo(map);
        userDot = L.marker(e.latlng, {
          icon: L.divIcon({ className: "user-dot", iconSize: [18, 18] }),
          zIndexOffset: 1000,                     // always on top of the places
        }).bindTooltip("You are here").addTo(map);
      }
    });

    map.on("locationerror", (e) => {
      alert("Couldn't get your location: " + e.message);
    });

    // =====================================================
    // ONE GROUP OF DOTS PER BUTTON
    // =====================================================
    const groups = {
      "Everything": L.layerGroup(),
      "Bathroom":   L.layerGroup(),
      "Fika":       L.layerGroup(),   // cafe, bakery, pastry, confectionery, ice_cream
    };

    // Make text safe to show inside the tooltip
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

        // Turn colour names like "blue" into three numbers between 0 and 1
    function toRGB(colorName) {
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.fillStyle = colorName;                 // browser converts any CSS colour to "#rrggbb"
      const hex = ctx.fillStyle;
      return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
    }

    // One colour filter per category: dark lines → category colour, white → transparent
    let filterDefs = "";
    for (const category of Object.keys(ICON_FILES)) {
      const [r, g, b] = toRGB(COLORS[category] || "gray");
      const k = ALPHA_GAIN;
      filterDefs += `
        <filter id="tint-${category}" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="
            0 0 0 0 ${r}
            0 0 0 0 ${g}
            0 0 0 0 ${b}
            ${-0.2126 * k} ${-0.7152 * k} ${-0.0722 * k} ${k} 0"/>
          <feMorphology operator="dilate" radius="${LINE_THICKEN}"/>
        </filter>`;
    }
    document.body.insertAdjacentHTML("beforeend",
      `<svg width="0" height="0" style="position:absolute">${filterDefs}</svg>`);

    // Build each icon once; every point of that category reuses it
    const icons = {};
    for (const [category, file] of Object.entries(ICON_FILES)) {
      icons[category] = L.divIcon({
        className: "",                           // removes Leaflet's default white box
        html: `<img src="${file}" alt=""
                    style="width:100%; height:100%; filter:url(#tint-${category});">`,
        iconSize: [ICON_SIZE, ICON_SIZE],
        iconAnchor: [ICON_SIZE / 2, ICON_SIZE / 2],
        tooltipAnchor: [ICON_SIZE / 2, 0],
      });
    }

    function makeDot(place) {
      const label = `${escapeHtml(place.name)} (${escapeHtml(place.category)})`;
      const icon = icons[place.category];

      if (icon) {
        return L.marker([place.lat, place.lon], { icon }).bindTooltip(label);
      }

      // No drawing for this category yet: keep the coloured dot
      const color = COLORS[place.category] || "gray";
      return L.circleMarker([place.lat, place.lon], {
        radius: DOT_RADIUS, color, fillColor: color, fillOpacity: DOT_OPACITY,
      }).bindTooltip(label);
    }

    // =====================================================
    // LOAD THE CSV AND DRAW THE DOTS
    // =====================================================
    Papa.parse(DATA_FILE, {
      download: true,        // fetch the file from the website
      header: true,          // first row = column names
      dynamicTyping: true,   // turn "59.33" into the number 59.33
      skipEmptyLines: true,
      complete: (results) => {
        for (const place of results.data) {
          if (place.lat == null || place.lon == null) continue;

          groups["Everything"].addLayer(makeDot(place));

          const button = place.category === "restroom" ? "Bathroom" : "Fika";
          groups[button].addLayer(makeDot(place));
        }

        // Show "Everything" first, then add the radio-button panel
        groups["Everything"].addTo(map);
        L.control.layers(groups, null, { collapsed: false, position: "topright" }).addTo(map);
      },
    });
  </script>
</body>
</html>
